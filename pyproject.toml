# 阶段 0 工程入口：声明 GraphFlow 包、Python 版本与 CLI，为后续 Harness 子包统一打包。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-workspace-graphflow"
version = "0.1.0"
description = "SPEC-GraphFlow runtime evolving toward an engineering-grade Agent Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
# GraphFlow CLI 是外层编排入口；未来 Harness CLI 通过独立命令接入，不旁路执行工具。
loop-graphflow = "scheduler.main:main"
# Harness CLI 位于单 Task 运维入口；正式 run 固定装配 Model Gateway 与 Docker Sandbox。
loop-harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["scheduler*", "harness*"]
